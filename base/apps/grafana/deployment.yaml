# grafana: 가져다 쓰는 공식 이미지라 코드 레포가 없고, 버전은 여기서 직접 올린다.
# 사용자·설정 DB(sqlite)는 PVC(/var/lib/grafana)에 둔다. 대시보드·데이터 소스는 ConfigMap에서 매번 다시 읽는다.
# 로그인 없이 보기(Viewer)를 켠다. 대시보드에는 deviceId와 배터리·벤치마크 숫자만 있고 사람 이름은 없다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  # 한 노드에만 붙는 볼륨(RWO)이라 옛 파드를 내린 뒤 새 파드를 띄운다
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      # GRAFANA_PORT=tcp://... 같은 값이 Grafana 설정과 섞이지 않게 끈다
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # 이미지 기본 사용자(grafana). fsGroup으로 PVC에 쓸 수 있게 한다
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_ANONYMOUS_HIDE_VERSION
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/trace/pilot-trend.dashboard.json
            # 아래 넷은 provisioning/datasources.yaml이 읽는다
            - name: INFLUX_URL
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: INFLUX_URL
            - name: INFLUX_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: INFLUX_BUCKET
            - name: INFLUX_ORG
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: INFLUX_ORG
            # 버킷 trace-pilot 읽기 전용 토큰. diagnostics-server가 쓰는 INFLUX_TOKEN(쓰기)과 따로 둔다
            - name: INFLUX_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: INFLUX_READ_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/trace.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/trace.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards/trace
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
