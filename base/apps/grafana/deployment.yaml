# grafana: 파일럿 추이 대시보드. 가져다 쓰는 공식 이미지라 버전은 여기서 직접 올린다(web grafana/docker-compose.yml과 같은 버전).
# 저장 공간(PVC)은 두지 않는다. 데이터 소스·대시보드는 ConfigMap grafana-provisioning에서 뜰 때마다 다시 등록되고,
# 사용자·세션을 담는 sqlite는 emptyDir라 파드가 다시 뜨면 비워진다(관리자 계정은 환경 변수로 다시 만들어진다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      # Service 이름이 grafana라 켜 두면 GRAFANA_PORT=tcp://... 같은 값이 붙는다. 쓸 일이 없어 끈다
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # 이미지 기본 사용자(grafana)
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana-oss:12.1.1
          ports:
            - name: http
              containerPort: 3000
          env:
            # 공개 주소: https://gakdo.site/grafana/ (WEB_PUBLIC_URL은 끝에 /가 없다). web nginx가 경로를 그대로 넘긴다
            - name: WEB_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: WEB_PUBLIC_URL
            - name: GF_SERVER_ROOT_URL
              value: $(WEB_PUBLIC_URL)/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            # 터널 뒤 HTTPS로만 열리므로 로그인 쿠키에 Secure를 붙인다
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            # 로그인 없이 보기(Viewer)만 허용. 가입은 막고, 편집은 admin만 한다
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_ANONYMOUS_HIDE_VERSION
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_DATABASE_WAL
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/trace/pilot-trend.dashboard.json
            # 아래 넷은 데이터 소스 provisioning 파일이 $INFLUX_* 로 읽는다
            - name: INFLUX_URL
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: INFLUX_URL
            - name: INFLUX_ORG
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: INFLUX_ORG
            - name: INFLUX_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: trace-infra
                  key: INFLUX_BUCKET
            # trace-pilot 읽기 전용 토큰. diagnostics-server가 쓰는 INFLUX_TOKEN(쓰기)과 따로 둔다
            - name: INFLUX_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: INFLUX_READ_TOKEN
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # serve_from_sub_path라 /grafana/ 아래 경로로 확인한다. 처음 뜰 때 DB 초기화로 최대 2분 기다린다
          startupProbe:
            httpGet:
              path: /grafana/api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /grafana/api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # sqlite·플러그인 폴더. 저장 공간 없이 파드와 함께 사라진다
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards/trace
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # ConfigMap 하나를 폴더 셋에 나눠 건다. 폴더마다 자기 파일 하나만 보이게 한다
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: trace-pilot.datasource.yaml
                path: trace-pilot.yaml
        - name: dashboard-providers
          configMap:
            name: grafana-provisioning
            items:
              - key: trace.dashboards.yaml
                path: trace.yaml
        - name: dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: pilot-trend.dashboard.json
                path: pilot-trend.dashboard.json
