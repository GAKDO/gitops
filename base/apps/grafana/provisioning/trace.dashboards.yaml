# 원본은 web/grafana(provisioning/dashboards/trace.yaml), 바꾸면 같이 갱신. 이 줄 아래는 원본 그대로 복사한다.
# pilot-trend.dashboard.json을 "trace" 폴더에 올린다. 화면에서 고쳐도 다시 띄우면 파일 내용으로 돌아간다
apiVersion: 1
providers:
  - name: trace
    folder: trace
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/trace
