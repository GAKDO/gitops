# 원본은 web/grafana(provisioning/datasources/trace-pilot.yaml), 바꾸면 같이 갱신. 이 줄 아래는 원본 그대로 복사한다.
# 클러스터에서는 $INFLUX_* 값을 base/apps/grafana/deployment.yaml의 env(infra.env·trace-secrets)가 채운다.
# InfluxDB v2(Flux) 데이터 소스. 값은 docker-compose.yml의 환경 변수(.env)에서 채운다.
# 대시보드 JSON이 uid trace-pilot으로 이 데이터 소스를 찾는다
apiVersion: 1
datasources:
  - name: trace-pilot
    uid: trace-pilot
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeout: 30
    secureJsonData:
      token: $INFLUX_READ_TOKEN
