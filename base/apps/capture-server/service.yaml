# 같은 네임스페이스 안에서는 http://capture-server:8080 으로 부른다
apiVersion: v1
kind: Service
metadata:
  name: capture-server
  labels:
    app.kubernetes.io/name: capture-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: capture-server
  ports:
    - name: http
      port: 8080
      targetPort: http
