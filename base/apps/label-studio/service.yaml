# 밖으로는 overlays/school이 NodePort 8316으로 바꿔 연다
apiVersion: v1
kind: Service
metadata:
  name: label-studio
  labels:
    app.kubernetes.io/name: label-studio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: label-studio
  ports:
    - name: http
      port: 8080
      targetPort: http
