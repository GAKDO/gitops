# 같은 네임스페이스 안에서는 http://gateway:8080 으로 부른다. 밖으로는 cloudflared가 https://gakdo.site/api/로 연다
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
