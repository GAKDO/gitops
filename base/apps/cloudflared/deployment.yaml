# cloudflared: Cloudflare Tunnel 커넥터. 클러스터 안에서 Cloudflare로 나가는 연결만 맺어 https://gakdo.site 를 받는다(들어오는 포트 불필요).
# 원격 관리 터널이라 경로 규칙(public hostname)은 Cloudflare 대시보드에 둔다(README "처음 한 번"):
#   gakdo.site, 경로 ^/api/  → http://gateway:8080
#   gakdo.site               → http://web:8080
# Cloudflare→cloudflared 구간은 터널이 암호화하므로 web·gateway는 클러스터 안에서 HTTP 그대로다.
# 토큰은 Secret trace-cloudflared의 TUNNEL_TOKEN (README). 없으면 파드가 만들어지지 않고 기다린다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  # 같은 토큰으로 2개를 띄우면 Cloudflare가 연결을 나눠 받아, 하나가 다시 떠도 끊기지 않는다
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.2
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trace-cloudflared
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # liveness는 프로세스 상태(/healthcheck), readiness는 에지 연결이 하나라도 있을 때 200(/ready)
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
