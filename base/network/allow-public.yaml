# 밖으로 여는 세 개(gateway·web·label-studio)만 어디서든 8080으로 받는다. NodePort(8314·8315·8316)로 들어온 요청이 여기로 온다.
# 나머지 서버 5개와 postgres는 같은 네임스페이스 안에서만 닿는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [gateway, web, label-studio]}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
