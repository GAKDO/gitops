# 밖으로 여는 label-studio(8080, NodePort 8316)와 grafana(3000, NodePort 8317)만 어디서든 받는다.
# gateway·web은 같은 네임스페이스의 cloudflared(터널)만 부르므로 allow-same-namespace로 충분하다. 나머지 서버와 postgres도 같은 네임스페이스 안에서만 닿는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [label-studio, grafana]}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 3000}
