name: 매니페스트 검증
# 클러스터에 올릴 설정이 올바른지 미리 본다. 클러스터에는 접속하지 않는다.
# PR과 main·develop 푸시(앱 레포가 이미지 태그를 바꾸는 커밋 포함)마다 돈다. 실제 배포는 Argo CD가 main을 보고 한다.
on:
  pull_request:
  push:
    branches: [main, develop]

# 읽기만 한다
permissions:
  contents: read

# 도구 버전을 고정해 실행할 때마다 같은 결과가 나오게 한다 (블로그 deploy.yml과 같은 버전)
env:
  KUSTOMIZE_VERSION: "5.7.1"
  KUBECONFORM_VERSION: "0.7.0"

jobs:
  validate:
    name: 매니페스트 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # kustomize(overlay를 합쳐 최종 YAML 생성)와 kubeconform(쿠버네티스 스키마 검사)을 받는다
      - name: 도구 설치
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
      # secret.env·kubeconfig 같은 파일, Secret 매니페스트, 비밀번호·키 패턴이 커밋에 섞였으면 실패
      - name: 비밀값이 커밋되지 않았는지 확인
        run: bash scripts/check-no-secrets.sh
      - name: 스크립트 문법 확인
        run: for f in scripts/*.sh base/postgres/init-db.sh compose/init-db.sh compose/init-env.sh compose/ops/*.sh tests/*.sh; do bash -n "$f"; done
      # 학교 서버 자동 배포 스크립트를 가짜 docker로 시험한다: 정상 교체, 응답 없으면 되돌리기, 실패한 이미지 재시도 금지, 멈춤
      - name: 자동 배포 스크립트 시험
        run: bash tests/autodeploy_test.sh
      # 로컬 Compose(G1)가 올바른지 본다. .env.example의 빈 값을 가짜 값으로 채워 변수 치환까지 확인한다(이미지는 받지 않음)
      - name: 로컬 Compose 설정 확인
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=ci-dummy/; s/^PUBLIC_BASE_URL=.*/PUBLIC_BASE_URL=http:\/\/localhost:8315/; s/^(WEB_PORT|WEB_BIND|INFRA_BIND|TRACE_TAG|[A-Z_]+_HOST_PORT)=.*/\1=/' compose/.env.example > compose/.env
          docker compose -f compose/docker-compose.yml config --quiet
          docker compose -f compose/docker-compose.yml config --format json | jq -e '.services["capture-server"].environment.MINIO_PUBLIC_BASE == "http://localhost:8315"' >/dev/null
          rm compose/.env
      # overlays/school을 실제로 빌드해 쿠버네티스 1.33 스키마로 검사한다. Argo CD Application 같은 CRD는 스키마가 없어 건너뛴다
      - name: kustomize 빌드 + 스키마 검사
        run: kustomize build overlays/school | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 -
