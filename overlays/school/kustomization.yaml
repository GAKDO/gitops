# 학교 Rancher 클러스터(네임스페이스 trace) 운영 구성. Argo CD(argocd/application.yaml)가 main의 이 폴더를 클러스터에 그대로 맞춘다.
# 앱 레포의 GitHub Actions는 이미지를 GHCR에 올린 뒤 이 폴더에서
#   kustomize edit set image <앱>=ghcr.io/gakdo/<앱>:<커밋 SHA>
# 를 돌려 images:의 newTag를 바꾸고 main에 커밋한다. 그래서 images:의 name은 base의 이미지 이름(앱 이름 그대로)과 같아야 한다.
# 이 명령은 파일을 kustomize 기본 형식(목록 들여쓰기 없음, images는 이름순)으로 다시 쓴다.
# 태그 커밋이 한 줄 차이로 남도록 이 파일도 처음부터 그 형식으로 둔다. 손으로 고칠 때도 형식을 지킨다.
# 비밀값은 여기 두지 않는다. trace-secrets·trace-postgres는 Rancher에서(또는 scripts/create-secrets.sh로) 손으로 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trace
labels:
- pairs:
    app.kubernetes.io/part-of: trace
resources:
- ../../base/apps/gateway
- ../../base/apps/web
- ../../base/apps/auth-server
- ../../base/apps/rental-server
- ../../base/apps/capture-server
- ../../base/apps/diagnostics-server
- ../../base/apps/report-server
- ../../base/apps/label-studio
- ../../base/apps/cloudflared
- ../../base/apps/grafana
- ../../base/postgres
- ../../base/network
images:
- name: auth-server
  newName: ghcr.io/gakdo/auth-server
  newTag: a3faeba87d07fa62c6039ba3945077c01f995a69
- name: capture-server
  newName: ghcr.io/gakdo/capture-server
  newTag: 83ad2f0692502a987a58f578bdd2c1831d83b499
- name: diagnostics-server
  newName: ghcr.io/gakdo/diagnostics-server
  newTag: 19f5e4ff9e8c61062a69449d80abc807497bb62d
- name: gateway
  newName: ghcr.io/gakdo/gateway
  newTag: 4b09f361a4934b107ecd53c247ee9a9680ca696d
- name: rental-server
  newName: ghcr.io/gakdo/rental-server
  newTag: 6a426b6d94282eb87a1b117d43c3e807b402706a
- name: report-server
  newName: ghcr.io/gakdo/report-server
  newTag: 30f8c58dd8f7f581e8a7c3fb4a8404ea86bb6aa9
- name: web
  newName: ghcr.io/gakdo/web
  newTag: 04ef6e2bb0de7c45133f57aab0509d4791e335d1
# 비밀이 아닌 접속 주소. 이름을 고정해(해시 없음) Rancher·CronJob에서도 같은 이름으로 찾는다.
# 대신 값을 바꿔도 파드가 저절로 다시 뜨지 않는다 (README "어디를 바꾸나")
configMapGenerator:
- envs:
  - infra.env
  name: trace-infra
  options:
    disableNameSuffixHash: true
# 밖으로 여는 서비스는 label-studio 하나(NodePort 8316). gateway·web은 Cloudflare Tunnel(cloudflared)로만 공개해
# 학교망에 평문 HTTP 포트를 열지 않고 CF-Connecting-IP 헤더 위조 경로도 막는다. 학교 서버는 NodePort를 8300~8499에서
# 학생마다 10개씩 나눠 주고, A 계정 범위는 8310~8319다
patches:
- patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 8316
  target:
    kind: Service
    name: label-studio
